<svg viewBox="0 0 1000 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"> 
  <defs>
    <!-- Beautiful modern gradient overlay -->
    <linearGradient id="worldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab47bc" />
      <stop offset="50%" stop-color="#42a5f5" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    
    <!-- Optional subtle shadow effect -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background color (Optional: Change to #ffffff if needed) -->
  <rect width="1000" height="500" fill="#f8f9fa" />

  <!-- World Map paths grouped together -->
  <g fill="url(#worldGradient)" filter="url(#dropShadow)" opacity="0.95">
    <!-- North America & Greenland -->
    <path d="M100,120 L120,90 L160,80 L210,75 L230,50 L270,60 L260,90 L240,110 L280,120 L300,150 L280,185 L220,180 L205,220 L230,245 L200,265 L180,240 L165,245 L155,200 L120,195 L95,170 Z M275,45 L300,30 L320,55 L290,75 Z" />
    
    <!-- South America -->
    <path d="M200,268 L230,247 L255,260 L280,275 L300,300 L320,330 L305,370 L280,430 L265,450 L255,445 L260,420 L240,380 L230,340 L220,300 Z" />
    
    <!-- Africa -->
    <path d="M430,220 L460,200 L500,205 L525,225 L535,260 L515,300 L490,345 L475,395 L465,400 L460,370 L445,320 L425,290 L410,260 L415,235 Z M530,335 L545,330 L540,360 L525,355 Z" />
    
    <!-- Eurasia (Europe and Asia) -->
    <path d="M410,180 L430,150 L420,130 L450,115 L470,80 L520,70 L580,75 L680,65 L760,70 L840,85 L880,110 L860,135 L805,150 L840,180 L880,175 L865,200 L810,210 L785,250 L755,240 L745,215 L710,210 L680,265 L660,260 L650,225 L610,230 L585,260 L560,250 L565,210 L505,210 L480,185 L440,195 Z" />
    
    <!-- United Kingdom & Iceland -->
    <path d="M405,115 L420,110 L415,125 L400,120 Z M360,85 L380,80 L375,95 Z" />
    
    <!-- Japan -->
    <path d="M855,140 L870,155 L860,170 L845,150 Z" />
    
    <!-- Indonesia, Philippines & SE Asia Islands -->
    <path d="M720,265 L740,260 L735,275 Z M750,255 L765,270 L755,280 Z M730,290 L770,290 L790,310 L760,320 L720,305 Z M795,280 L820,295 L800,315 Z" />
    
    <!-- Australia & New Zealand -->
    <path d="M730,350 L780,340 L830,365 L840,400 L810,420 L760,415 L735,390 Z M850,420 L870,415 L865,445 L845,440 Z" />
  </g>
</svg>
